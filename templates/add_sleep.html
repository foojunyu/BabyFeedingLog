{% extends "base.html" %}

{% block title %}Add Sleep - {{ baby.name }}{% endblock %}

{% block content %}
<div class="nav">
    <a href="{{ url_for('baby_dashboard', baby_id=baby.id) }}" class="btn btn-secondary">← Back to Dashboard</a>
</div>

<h2>Log Sleep for {{ baby.name }}</h2>

<form method="POST">
    <div class="form-group">
        <label for="start_time">Start Time *</label>
        <input type="datetime-local" id="start_time" name="start_time" required>
    </div>
    
    <div class="form-group">
        <label for="end_time">End Time</label>
        <input type="datetime-local" id="end_time" name="end_time">
    </div>
    
    <div class="form-group">
        <label for="notes">Notes</label>
        <textarea id="notes" name="notes"></textarea>
    </div>
    
    <div class="form-group" style="text-align: center;">
        <button type="submit" class="btn">Log Sleep</button>
    </div>
</form>

<script>
    // Set current date and time as default for start time
    document.addEventListener('DOMContentLoaded', function() {
        var now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('start_time').value = now.toISOString().slice(0, 16);
    });
</script>
{% endblock %}
