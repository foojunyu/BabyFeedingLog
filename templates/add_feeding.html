{% extends "base.html" %}

{% block title %}Add Feeding - {{ baby.name }}{% endblock %}

{% block content %}
<div class="nav">
    <a href="{{ url_for('baby_dashboard', baby_id=baby.id) }}" class="btn btn-secondary">← Back to Dashboard</a>
</div>

<h2>Log Feeding for {{ baby.name }}</h2>

<form method="POST">
    <div class="form-group">
        <label for="timestamp">Date & Time *</label>
        <input type="datetime-local" id="timestamp" name="timestamp" required>
    </div>
    
    <div class="form-group">
        <label for="feeding_type">Feeding Type *</label>
        <select id="feeding_type" name="feeding_type" required>
            <option value="breast">Breast</option>
            <option value="bottle">Bottle</option>
            <option value="solid">Solid Food</option>
        </select>
    </div>
    
    <div class="form-group">
        <label for="amount">Amount (ml)</label>
        <input type="number" id="amount" name="amount" step="0.1" min="0">
    </div>
    
    <div class="form-group">
        <label for="duration">Duration (minutes)</label>
        <input type="number" id="duration" name="duration" min="0">
    </div>
    
    <div class="form-group">
        <label for="notes">Notes</label>
        <textarea id="notes" name="notes"></textarea>
    </div>
    
    <div class="form-group" style="text-align: center;">
        <button type="submit" class="btn">Log Feeding</button>
    </div>
</form>

<script>
    // Set current date and time as default
    document.addEventListener('DOMContentLoaded', function() {
        var now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('timestamp').value = now.toISOString().slice(0, 16);
    });
</script>
{% endblock %}
