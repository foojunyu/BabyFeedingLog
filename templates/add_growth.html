{% extends "base.html" %}

{% block title %}Add Growth Record - {{ baby.name }}{% endblock %}

{% block content %}
<div class="nav">
    <a href="{{ url_for('baby_dashboard', baby_id=baby.id) }}" class="btn btn-secondary">← Back to Dashboard</a>
</div>

<h2>Add Growth Record for {{ baby.name }}</h2>

{% if error %}
<div style="background: #ffebee; color: #c62828; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #c62828;">
    <strong>Error:</strong> {{ error }}
</div>
{% endif %}

<form method="POST">
    <div class="form-group">
        <label for="date">Date *</label>
        <input type="date" id="date" name="date" required>
    </div>
    
    <div class="form-group">
        <label for="weight">Weight (kg)</label>
        <input type="number" id="weight" name="weight" step="0.01" min="0">
    </div>
    
    <div class="form-group">
        <label for="height">Height (cm)</label>
        <input type="number" id="height" name="height" step="0.1" min="0">
    </div>
    
    <div class="form-group">
        <label for="head_circumference">Head Circumference (cm)</label>
        <input type="number" id="head_circumference" name="head_circumference" step="0.1" min="0">
    </div>
    
    <div class="form-group">
        <label for="notes">Notes</label>
        <textarea id="notes" name="notes"></textarea>
    </div>
    
    <div class="form-group" style="text-align: center;">
        <button type="submit" class="btn">Add Growth Record</button>
    </div>
</form>

<script>
    // Set current date as default
    document.addEventListener('DOMContentLoaded', function() {
        var now = new Date();
        document.getElementById('date').value = now.toISOString().split('T')[0];
    });
</script>
{% endblock %}
